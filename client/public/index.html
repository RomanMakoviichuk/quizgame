<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Playpen+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <!-- a static screen: no pinch zoom, no double-tap zoom, no zoom into a field -->
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#2a170b" />
    <!-- dark brown right away, before any CSS or picture has loaded (no grey flash on phones) -->
    <style>html,body{background:#2a170b;}html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%;}</style>
    <script>
      // iOS Safari ignores user-scalable=no: stop its pinch zoom by hand
      // (double-tap zoom is off through touch-action: quick taps in the minigames stay taps)
      (function () {
        var stop = function (e) { e.preventDefault(); };
        document.addEventListener("gesturestart", stop, { passive: false });
        document.addEventListener("gesturechange", stop, { passive: false });
        document.addEventListener("touchmove", function (e) {
          if (e.touches.length > 1 || (e.scale !== undefined && e.scale !== 1)) e.preventDefault();
        }, { passive: false });
      })();
    </script>
    <meta
      name="description"
      content="Хто є хто! — хорор-вікторина для компанії: великий екран і телефони гравців"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Хто є хто!</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
